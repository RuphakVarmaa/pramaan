# Pramaan — Fly.io deployment
# Test-mode only. Single process, SQLite on a small persistent volume.
app = "pramaan"
primary_region = "blr"

[build]
  builder = "dockerfile"

[env]
  PRAMAAN_PORT = "8080"
  PRAMAAN_DB = "/data/pramaan.db"
  PRAMAAN_STUB_PAYMENTS = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "pramaan_data"
  destination = "/data"
